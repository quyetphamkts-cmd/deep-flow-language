name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài thư viện
        run: npm ci

      - name: Kiểm tra bản vá nút thông báo
        run: |
          F=node_modules/@jofr/capacitor-media-session/android/src/main/java/io/github/jofr/capacitor/mediasessionplugin/MediaSessionService.java
          grep -q DF_PATCH "$F" && grep -q DF_TEXT "$F" && echo "::notice::Đã vá plugin media-session (nút chế độ phát + nút tắt)" || { echo "::error::Chưa vá plugin media-session"; exit 1; }

      - name: Đồng bộ phần web vào Android
        run: npx cap sync android

      - name: Đọc số phiên bản
        id: ver
        run: |
          echo "code=$(jq -r '.apk.versionCode' update/version.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.apk.versionName' update/version.json)" >> "$GITHUB_OUTPUT"

      - name: Giải mã khoá ký
        env:
          DF_SIGN_PASSWORD: ${{ secrets.DF_SIGN_PASSWORD }}
        run: |
          if [ -z "$DF_SIGN_PASSWORD" ]; then
            echo "::warning::Chưa có secret DF_SIGN_PASSWORD (xem README, mục 1) — chỉ kiểm tra biên dịch, không phát hành"
            echo "DF_NOKEY=1" >> "$GITHUB_ENV"; exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/deepflow-release.jks.enc -out "$RUNNER_TEMP/deepflow.jks" -pass env:DF_SIGN_PASSWORD

      - name: Build APK
        working-directory: android
        env:
          DF_KEYSTORE_FILE: ${{ env.DF_NOKEY != '1' && format('{0}/deepflow.jks', runner.temp) || '' }}
          DF_KEYSTORE_PASSWORD: ${{ secrets.DF_SIGN_PASSWORD }}
          DF_KEY_ALIAS: deepflow
          DF_KEY_PASSWORD: ${{ secrets.DF_SIGN_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon -PdfVersionCode=${{ steps.ver.outputs.code }} -PdfVersionName=${{ steps.ver.outputs.name }} 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "error:|warning: \[|e: |What went wrong|Could not|FAILURE|> " build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
            exit $rc
          fi
          mkdir -p ../dist
          if [ "$DF_NOKEY" = "1" ]; then exit 0; fi
          cp app/build/outputs/apk/release/app-release.apk ../dist/DeepFlowLanguage.apk

      - uses: actions/upload-artifact@v4
        if: env.DF_NOKEY != '1'
        with:
          name: DeepFlowLanguage-${{ steps.ver.outputs.name }}
          path: dist/DeepFlowLanguage.apk

      - name: Phát hành
        if: env.DF_NOKEY != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Deep Flow Language ${{ steps.ver.outputs.name }}
          files: dist/DeepFlowLanguage.apk
          make_latest: true
          body: |
            Tải **DeepFlowLanguage.apk** bên dưới, mở trên điện thoại Android để cài (hoặc cài đè lên bản cũ — dữ liệu được giữ nguyên).

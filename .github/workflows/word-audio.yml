name: Word audio
on:
  workflow_dispatch:
  push:
    paths: ['tools/word_synth.py', 'tools/words_chua.txt', '.github/workflows/word-audio.yml']
permissions:
  contents: write
jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q piper-tts numpy
      - run: python -m piper.download_voices en_US-lessac-high en_GB-alba-medium --download-dir v
      - run: python tools/word_synth.py v/en_US-lessac-high tools/words_chua.txt out/us
      - name: Push to branch word-audio
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan word-audio; git rm -rfq .; mv out/* . ; git add us; git commit -qm "Word audio"; git push -f origin word-audio

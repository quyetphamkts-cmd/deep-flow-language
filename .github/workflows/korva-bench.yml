name: KorvaTTS bench
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/korva/bench.py', '.github/workflows/korva-bench.yml']
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install korvatts==0.1.3 onnxruntime==1.22.0 soundfile numpy
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: mkdir kv && gh release download korva-v1 -D kv -p '*.int8.onnx' -p 'tts.json' -p 'unicode_indexer.json' -p 'voices.json'
      - run: python tools/korva/bench.py 0 && python tools/korva/bench.py 1

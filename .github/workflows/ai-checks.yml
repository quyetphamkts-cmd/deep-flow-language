name: Kiểm tra AI và build thử Android
on:
  pull_request:
    paths:
      - 'www/**'
      - 'tests/**'
      - 'tools/check-web.cjs'
      - 'update/version.json'
      - '.github/workflows/ai-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - run: node tools/check-web.cjs
      - run: npx cap sync android
      - name: Biên dịch APK debug (không ký phát hành, không triển khai)
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

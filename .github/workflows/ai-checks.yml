name: Kiểm tra AI và build thử Android
on:
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/**'
      - 'www/**'
      - 'tests/**'
      - 'tools/check-web.cjs'
      - 'update/version.json'
      - '.github/workflows/ai-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: node --test tests/*.test.cjs
      - run: node tools/check-web.cjs
      - name: Cài công cụ kiểm thử trình duyệt riêng trong thư mục tạm
        run: npm install --prefix "$RUNNER_TEMP/df-browser" --no-save --package-lock=false playwright@1.56.1
      - name: Kiểm thử các nút và văn bản trên Chrome
        env:
          NODE_PATH: ${{ runner.temp }}/df-browser/node_modules
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/lesson-text.browser.cjs
      - name: Lưu ảnh kiểm tra giao diện điện thoại
        uses: actions/upload-artifact@v4
        with:
          name: study-ui-${{ github.run_number }}
          path: ${{ runner.temp }}/study51-*.png
          if-no-files-found: error
      - run: npx cap sync android
      - name: Kiểm thử Java chẩn đoán crash
        working-directory: android
        run: bash gradlew testDebugUnitTest --no-daemon
      - name: Kiểm tra khóa ký hiện có (chỉ PR cùng repository hoặc chạy thủ công)
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DF_SIGN_PASSWORD: ${{ secrets.DF_SIGN_PASSWORD }}
        run: |
          if [ -z "$DF_SIGN_PASSWORD" ]; then
            echo "::error::Workflow không nhận được secret DF_SIGN_PASSWORD. Kiểm tra phạm vi secret và quyền truy cập repository."
            exit 1
          fi
          test -s signing/deepflow-release.jks.enc
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/deepflow-release.jks.enc -out "$RUNNER_TEMP/deepflow-test.jks" -pass env:DF_SIGN_PASSWORD
          keytool -list -keystore "$RUNNER_TEMP/deepflow-test.jks" -storepass:env DF_SIGN_PASSWORD -alias deepflow > /dev/null
          echo "Đã giải mã keystore hiện có và xác nhận alias deepflow."
      - name: Build APK ký bằng khóa cũ (không phát hành)
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        working-directory: android
        env:
          DF_KEYSTORE_FILE: ${{ runner.temp }}/deepflow-test.jks
          DF_KEYSTORE_PASSWORD: ${{ secrets.DF_SIGN_PASSWORD }}
          DF_KEY_ALIAS: deepflow
          DF_KEY_PASSWORD: ${{ secrets.DF_SIGN_PASSWORD }}
        run: |
          code=$(node -p "require('../update/version.json').apk.versionCode")
          version=$(node -p "require('../update/version.json').apk.versionName")
          bash gradlew assembleRelease --no-daemon -PdfVersionCode="$code" -PdfVersionName="$version"
      - name: Build không ký cho PR từ fork (không dùng secret)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        working-directory: android
        run: bash gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: DeepFlowLanguage-test-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Xóa bản giải mã tạm
        if: always()
        run: rm -f "$RUNNER_TEMP/deepflow-test.jks"

  renderer-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx cap sync android
      - name: Cho phép runner sử dụng KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Kiểm thử renderer WebView thật trên Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && bash gradlew connectedDebugAndroidTest --no-daemon -PdfEmulator=true
      - name: Lưu kết quả Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-recovery-${{ github.run_number }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
